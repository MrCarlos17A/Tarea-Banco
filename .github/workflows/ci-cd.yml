name: ci-cd
on:
  pull_request:
  push: {branches: [main]}
env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  TAG: ${{ github.sha }}
jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - name: Compilar y pruebas unitarias
        run: mvn -B -f backend/pom.xml verify
      - name: Analisis de codigo (SAST)
        run: mvn -B -f backend/pom.xml sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        continue-on-error: true
      - name: Construir imagenes
        run: |
          docker build -t $REGISTRY/demo-backend:$TAG backend
          docker build -t $REGISTRY/demo-frontend:$TAG frontend
      - name: Escanear vulnerabilidades (bloquea HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/demo-backend:${{ env.TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Publicar imagenes
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $REGISTRY/demo-backend:$TAG
          docker push $REGISTRY/demo-frontend:$TAG
      - name: Desplegar en ambiente de prueba
        if: github.ref == 'refs/heads/main'
        run: |
          docker compose up -d --build
          sleep 40
          curl -f http://localhost:8080/
