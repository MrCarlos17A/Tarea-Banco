server:
  port: 8080
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://db:5432/solicitudes}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:dev_only}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
app:
  jwt-secret: ${JWT_SECRET:dev-secret-cambiar-por-uno-de-32-caracteres-minimo}
  admin-password: ${ADMIN_PWD:Cambiar123!}
